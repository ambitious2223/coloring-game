<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Color Chaos</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="cc-header">
      <div class="cc-brand">
        <span class="cc-logo">🎨</span>
        <div>
          <h1 id="tTitle">Color Chaos</h1>
          <p id="tSubtitle" class="cc-sub">Comment a region number and a color.</p>
        </div>
      </div>
      <div class="cc-badges">
        <span id="dockStatus" class="cc-status">Connecting…</span>
        <span id="modeBadge" class="cc-badge">Lock</span>
        <select id="langSelect" class="cc-lang" title="Language">
          <option value="en">EN</option>
          <option value="tr">TR</option>
          <option value="ar">AR</option>
        </select>
        <button id="btnControls" class="cc-btn" type="button">Controls</button>
        <button id="btnLive" class="cc-btn live-btn" type="button">Go Live</button>
      </div>
    </header>

    <div id="testBanner" class="cc-testbanner">TEST MODE — not live</div>

    <main class="cc-main">
      <section class="cc-stage">
        <div id="board" class="cc-board"></div>
        <div class="cc-overlay">
          <div class="cc-progress">
            <span id="tProgress" class="cc-progress-label">Progress</span>
            <div class="cc-bar"><div id="progressBar" class="cc-bar-fill"></div></div>
            <b id="progressText" class="cc-progress-count">0 / 0</b>
          </div>
          <div id="ticker" class="cc-feed"></div>
        </div>
        <div id="stageOverlay" class="cc-stageoverlay"></div>
        <div id="legend" class="cc-legend"></div>
      </section>

      <aside class="cc-panel">
        <h2 id="tPalette">Palette</h2>
        <div id="paletteBar" class="cc-palette"></div>
        <p class="cc-hint" id="tHint">Pick a color, then click a region to test.</p>
      </aside>
    </main>

    <aside id="controls" class="cc-controls">
      <div class="cc-controls-head">
        <span id="tControls">Controls</span>
        <button id="ctlClose" type="button" class="cc-x" aria-label="Close">✕</button>
      </div>

      <label class="cc-field"><span id="tSource">Source</span>
        <select id="ctlSource">
          <option value="hub">Hub (live)</option>
          <option value="bridge">Bridge (TikFinity)</option>
          <option value="both">Hub + Bridge</option>
          <option value="demo">Demo</option>
          <option value="off">Off</option>
        </select>
      </label>

      <label class="cc-check"><input id="ctlAutoSim" type="checkbox" /> <span id="tAutoSim">Auto-simulate</span></label>

      <label class="cc-field"><span id="tMode">Mode</span>
        <select id="ctlMode"><option value="lock">Lock</option><option value="chaos">Chaos</option></select>
      </label>

      <label class="cc-field"><span id="tGameMode">Game mode</span>
        <select id="ctlGameMode"><option value="free">Free</option><option value="turns">Turns</option><option value="pixel">Pixel</option></select>
      </label>

      <label class="cc-field"><span id="tCanvas">Canvas</span>
        <select id="ctlCanvas"></select>
      </label>

      <label class="cc-field"><span id="tIconStyle">Trigger icons</span>
        <select id="ctlIconStyle">
          <option value="bw">Black &amp; white</option>
          <option value="glitch">Glitch</option>
          <option value="fade">Fade</option>
        </select>
      </label>

      <label class="cc-check"><input id="ctlAutoCam" type="checkbox" checked /> <span id="tAutoCam">Auto camera</span></label>

      <label class="cc-field"><span id="tSignupMode">Sign-up</span>
        <select id="ctlSignupMode"><option value="free">Free</option><option value="gift">Gift</option></select>
      </label>

      <div class="cc-controls-row">
        <button id="ctlSimulate" type="button" class="ghost">Simulate viewer</button>
        <button id="ctlReset" type="button" class="ghost">Reset</button>
      </div>

      <div class="cc-controls-row">
        <button id="ctlOpenSignup" type="button" class="ghost">Open sign-up</button>
        <button id="ctlStart" type="button">Start</button>
      </div>
      <div class="cc-controls-row">
        <button id="ctlSkip" type="button" class="ghost">Skip</button>
        <button id="ctlEnd" type="button" class="ghost">End</button>
      </div>

      <div class="cc-controls-send">
        <label class="cc-field"><span id="tSkipSeconds">Skip after (s)</span><input id="ctlSkipSeconds" type="number" min="3" value="20" /></label>
        <label class="cc-field"><span id="tPerTurn">Regions / turn</span><input id="ctlPerTurn" type="number" min="1" max="6" value="1" /></label>
      </div>

      <div class="cc-controls-send">
        <label class="cc-field"><span id="tRegion">Region</span><input id="ctlRegion" type="number" min="1" value="1" /></label>
        <label class="cc-field"><span id="tColor">Color</span><select id="ctlColor"></select></label>
        <label class="cc-field"><span id="tUser">User</span><input id="ctlUser" type="text" value="host" /></label>
        <button id="ctlSend" type="button">Send</button>
      </div>
    </aside>

    <div id="instrBar" class="cc-instr"></div>
    <div id="toasts" class="cc-toasts"></div>

    <button id="liveHint" class="cc-livehint" type="button">
      <span id="liveHintText">Exit Live</span> <kbd>H</kbd>
    </button>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
